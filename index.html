<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Sign-up</title>
</head>
<body>
    <div id="img_div">
        <img src="background-josh-williams-hxcrYnLojfg-unsplash.jpg" alt="night_sky" id="night_sky">
        <div id="odin_logo">
            <img src="odin-lined.png" alt="odin" id="odin_image">
            <p>ODIN</p>
        </div>
        <p>Photo by <a href="https://unsplash.com/@joshwi?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Josh Williams</a> on <a href="https://unsplash.com/photos/starry-night-sky-over-a-snowy-mountain-landscape-hxcrYnLojfg?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
      </p>
    </div>
    <div id="data_div">
        <p>This is not a real online service! You know
            you need something like this in your life
            to help you realize your deepest dreams.<br>
            Sign up now to get started.
            <br><br>
            You <em>know</em> you want to.
        </p>
        <div id="form_div">
            <form action="">
                <legend>Let's do this!</legend>
                <div id="form_columns">
                    <div id="column1">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name">
                        
                        <label for="email">EMAIL</label>
                        <input type="email" id="email">
                        
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password">
                    </div>

                    <div id="column2">
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name">

                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="text" id="phone_number">
                        
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password">
                    </div>
                </div>
            </form>
        </div>
        <button id="crt_acc">Create Account</button>
        <p>Already have an account? <a href="">Log in</a></p>
    </div>
</body>
</html>
