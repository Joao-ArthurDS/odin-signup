<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Sign-up</title>
</head>
<body>
    <div id="img_div">

    </div>
    <div id="data_div">
        <p>This is not a real online service! You know
            you need something like this in your life
            to help you realize your deepest dreams.<br>
            Sign up now to get started.
            <br><br>
            You <em>know</em> you want to.
        </p>
        <div id="form_div">
            <form action="">
                <legend>Let's do this!</legend>
                <label for="first_name">FIRST NAME</label>
                <input type="text" id="first_name">
                
                <label for="last_name">LAST NAME</label>
                <input type="text" id="last_name">

                <label for="email">EMAIL</label>
                <input type="text" id="email">
                
                <label for="phone_number">PHONE NUMBER</label>
                <input type="text" id="phone_number">
                
                <label for="password">PASSWORD</label>
                <input type="text" id="password">
                
                <label for="confirm_password">CONFIRM PASSWORD</label>
                <input type="text" id="confirm_password">
            </form>
            <button>Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
</body>
</html>
